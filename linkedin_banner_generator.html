<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>LinkedIn Banner Generator</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;600;800&display=swap');

        body {
            margin: 0;
            padding: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            background-color: #0f172a;
            font-family: 'Inter', sans-serif;
        }

        .banner-container {
            width: 1200px;
            height: 675px;
            background: linear-gradient(135deg, #1a1a2e 0%, #16213e 100%);
            position: relative;
            overflow: hidden;
            box-shadow: 0 20px 50px rgba(0,0,0,0.5);
        }

        /* Grid Overlay */
        .grid-overlay {
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background-image: 
                linear-gradient(rgba(255, 255, 255, 0.03) 1px, transparent 1px),
                linear-gradient(90deg, rgba(255, 255, 255, 0.03) 1px, transparent 1px);
            background-size: 40px 40px;
            pointer-events: none;
        }

        /* Header */
        .header {
            text-align: center;
            margin-top: 60px;
            position: relative;
            z-index: 10;
        }

        h1 {
            font-size: 72px;
            color: #ffffff;
            margin: 0;
            font-weight: 800;
            letter-spacing: -2px;
            text-shadow: 0 4px 20px rgba(0,0,0,0.3);
            background: linear-gradient(to right, #fff, #cbd5e1);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .subtitle {
            color: #94a3b8;
            font-size: 24px;
            margin-top: 10px;
            font-weight: 400;
            letter-spacing: 1px;
            text-transform: uppercase;
        }

        /* Workflow Diagram */
        .workflow {
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 40px;
            margin-top: 80px;
            position: relative;
            z-index: 10;
        }

        .card {
            width: 240px;
            height: 180px;
            background: rgba(255, 255, 255, 0.03);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 24px;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            backdrop-filter: blur(10px);
            box-shadow: 0 8px 32px 0 rgba(0, 0, 0, 0.3);
            transition: transform 0.3s ease;
        }

        .card-icon {
            font-size: 64px;
            margin-bottom: 20px;
            filter: drop-shadow(0 0 15px rgba(0, 217, 255, 0.3));
        }

        .card-title {
            color: #e2e8f0;
            font-size: 18px;
            font-weight: 600;
        }

        .arrow {
            font-size: 40px;
            color: #00d9ff;
            text-shadow: 0 0 15px #00d9ff;
            animation: pulse 2s infinite;
        }

        @keyframes pulse {
            0% { opacity: 0.5; transform: translateX(0); }
            50% { opacity: 1; transform: translateX(5px); }
            100% { opacity: 0.5; transform: translateX(0); }
        }

        /* Tech Stack */
        .tech-stack {
            position: absolute;
            bottom: 60px;
            width: 100%;
            text-align: center;
        }

        .tech-badges {
            display: inline-flex;
            gap: 15px;
            background: rgba(0, 0, 0, 0.3);
            padding: 15px 30px;
            border-radius: 50px;
            border: 1px solid rgba(255, 255, 255, 0.05);
        }

        .badge {
            color: #94a3b8;
            font-weight: 600;
            font-size: 18px;
            display: flex;
            align-items: center;
            gap: 8px;
        }
        
        .separator {
            color: #475569;
        }

        /* Speed Badge */
        .speed-badge {
            position: absolute;
            top: 40px;
            right: 40px;
            background: #fbbf24;
            color: #0f172a;
            padding: 12px 24px;
            border-radius: 100px;
            font-weight: 800;
            font-size: 20px;
            box-shadow: 0 4px 15px rgba(251, 191, 36, 0.4);
            transform: rotate(5deg);
            z-index: 20;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        /* Decorative Glows */
        .glow {
            position: absolute;
            width: 400px;
            height: 400px;
            border-radius: 50%;
            filter: blur(100px);
            opacity: 0.15;
            z-index: 1;
        }
        .glow-1 { top: -100px; left: -100px; background: #00d9ff; }
        .glow-2 { bottom: -100px; right: -100px; background: #a855f7; }

    </style>
</head>
<body>

    <div class="banner-container">
        <!-- Background Elements -->
        <div class="grid-overlay"></div>
        <div class="glow glow-1"></div>
        <div class="glow glow-2"></div>
        
        <!-- Speed Badge -->
        <div class="speed-badge">
            ⚡ 200x Faster
        </div>

        <!-- Header -->
        <div class="header">
            <h1>Cold Email Agent</h1>
            <div class="subtitle">AI-Powered Proposal Generator</div>
        </div>

        <!-- Main Workflow -->
        <div class="workflow">
            <!-- Step 1 -->
            <div class="card">
                <div class="card-icon">📄</div>
                <div class="card-title">Job Posting</div>
            </div>

            <!-- Arrow -->
            <div class="arrow">➜</div>

            <!-- Step 2 -->
            <div class="card" style="border-color: rgba(168, 85, 247, 0.3);">
                <div class="card-icon" style="filter: drop-shadow(0 0 15px rgba(168, 85, 247, 0.3));">🧠</div>
                <div class="card-title">AI Extraction</div>
            </div>

            <!-- Arrow -->
            <div class="arrow">➜</div>

            <!-- Step 3 -->
            <div class="card">
                <div class="card-icon">✉️</div>
                <div class="card-title">Persuasive Email</div>
            </div>
        </div>

        <!-- Tech Stack -->
        <div class="tech-stack">
            <div class="tech-badges">
                <span class="badge">FastAPI</span>
                <span class="separator">•</span>
                <span class="badge">React</span>
                <span class="separator">•</span>
                <span class="badge">LangChain</span>
                <span class="separator">•</span>
                <span class="badge">Groq</span>
                <span class="separator">•</span>
                <span class="badge">ChromaDB</span>
            </div>
        </div>
    </div>

</body>
</html>
